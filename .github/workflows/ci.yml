name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: omnia
          POSTGRES_PASSWORD: omnia
          POSTGRES_DB: omnia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnia -d omnia" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://omnia:omnia@localhost:5432/omnia
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - name: Migrações sem deriva (schema.ts contra os snapshots do drizzle)
        shell: bash
        run: |
          # drizzle-kit sai com 0 até quando falha (sem TTY, colisão de snapshots): por isso confere o texto.
          npx drizzle-kit check </dev/null 2>&1 | tee "$RUNNER_TEMP/drizzle-check.txt" || true
          if ! grep -q "Everything's fine" "$RUNNER_TEMP/drizzle-check.txt"; then
            echo "::error::drizzle-kit check não aprovou os snapshots (colisão ou cadeia quebrada em drizzle/meta)."
            exit 1
          fi
          npx drizzle-kit generate </dev/null 2>&1 | tee "$RUNNER_TEMP/drizzle-generate.txt" || true
          if ! grep -q "No schema changes, nothing to migrate" "$RUNNER_TEMP/drizzle-generate.txt"; then
            echo "::error::schema.ts mudou sem migração (rode npm run db:generate e commite o resultado) ou o drizzle-kit não conseguiu comparar (renomeação de coluna pede terminal interativo)."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::o drizzle-kit alterou arquivos em drizzle/ mesmo sem mudança de schema."
            git status --porcelain -- drizzle
            exit 1
          fi
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            git /repo --redact --verbose --exit-code 1

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target producao -t omnia-api:ci .
